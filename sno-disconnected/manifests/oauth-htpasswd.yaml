# OAuth Configuration with HTPasswd Identity Provider
# For SNO Disconnected Cluster
#
# Apply with: oc apply -f oauth-htpasswd.yaml
#
# Prerequisites:
#   1. htpasswd-secret must exist in openshift-config namespace
#   2. Create with:
#      htpasswd -cbB /tmp/htpasswd admin '<password>'
#      htpasswd -bB /tmp/htpasswd developer '<password>'
#      oc create secret generic htpasswd-secret \
#        --from-file=htpasswd=/tmp/htpasswd -n openshift-config
#      rm /tmp/htpasswd
#
# After applying:
#   - Grant admin role: oc adm policy add-cluster-role-to-user cluster-admin admin
#   - Wait for OAuth pods: oc get pods -n openshift-authentication -w
---
apiVersion: config.openshift.io/v1
kind: OAuth
metadata:
  name: cluster
spec:
  identityProviders:
    - name: htpasswd
      type: HTPasswd
      mappingMethod: claim
      htpasswd:
        fileData:
          name: htpasswd-secret
