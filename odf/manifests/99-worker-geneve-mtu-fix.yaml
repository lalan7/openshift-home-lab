apiVersion: machineconfiguration.openshift.io/v1
kind: MachineConfig
metadata:
  labels:
    machineconfiguration.openshift.io/role: worker
  name: 99-worker-geneve-mtu-fix
spec:
  config:
    ignition:
      version: 3.2.0
    systemd:
      units:
      - name: fix-geneve-mtu.service
        enabled: true
        contents: |
          [Unit]
          Description=Fix Geneve MTU for OVN-Kubernetes on KVM
          After=ovs-configuration.service
          Before=kubelet.service
          
          [Service]
          Type=oneshot
          ExecStart=/bin/bash -c 'sleep 15 && /usr/sbin/ip link set genev_sys_6081 mtu 1400 2>/dev/null || true'
          RemainAfterExit=yes
          
          [Install]
          WantedBy=multi-user.target

