---
# MachineConfig to fix OVS netlink buffer overflow
# This increases network buffers to prevent packet loss
# 
# Impact: Requires MCP update (nodes will reboot sequentially)
# Expected time: 30-60 minutes for all nodes
#
# Verification after apply:
#   oc debug node/hosted-worker9.hypershift.lab -- chroot /host sysctl net.core.rmem_max
#   Should show: 4194304
apiVersion: machineconfiguration.openshift.io/v1
kind: MachineConfig
metadata:
  labels:
    machineconfiguration.openshift.io/role: worker
  name: 99-worker-netlink-buffers
spec:
  config:
    ignition:
      version: 3.2.0
    storage:
      files:
      - contents:
          # Base64 encoded content of sysctl tuning file
          # Decoded content:
          # ---
          # # Increase netlink buffers for OVS (fixes packet loss)
          # net.core.rmem_default = 4194304
          # net.core.rmem_max = 4194304
          # net.core.wmem_default = 4194304
          # net.core.wmem_max = 4194304
          # # Increase netdev budget for high traffic
          # net.core.netdev_budget = 600
          # net.core.netdev_budget_usecs = 8000
          # # Increase backlog queue
          # net.core.netdev_max_backlog = 5000
          # ---
          source: data:text/plain;charset=utf-8;base64,
        mode: 0644
        path: /etc/sysctl.d/99-ovs-netlink.conf
        overwrite: true

