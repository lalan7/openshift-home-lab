apiVersion: local.storage.openshift.io/v1alpha1
kind: LocalVolumeSet
metadata:
  name: localblock
  namespace: openshift-local-storage
spec:
  storageClassName: localblock
  # Use Block so PVs are suitable for OSD data PVCs (volumeDevices)
  volumeMode: Block
  deviceInclusionSpec:
    deviceTypes:
      - disk
    # Optional filters – adjust to match your lab if you want to narrow devices
    # minSize: 100Gi
    # maxSize: 2Ti
  nodeSelector:
    nodeSelectorTerms:
      - matchExpressions:
          # Reuse the ODF node label so only ODF nodes contribute disks
          - key: cluster.ocs.openshift.io/openshift-storage
            operator: Exists


