---
# RBD Block PVC Test for hosted-worker10.hypershift.lab
# Namespace: worker10-rbd
# StorageClass: ocs-storagecluster-ceph-rbd-kvm (KVM-optimized, no exclusive-lock)
# VolumeMode: Block (raw block device, not filesystem)

apiVersion: v1
kind: Namespace
metadata:
  name: worker10-rbd
  labels:
    purpose: rbd-block-testing
    node: hosted-worker10
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rbd-block-test-pvc
  namespace: worker10-rbd
  labels:
    app: rbd-block-test
    storage-type: rbd-block
    node: hosted-worker10
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: ocs-storagecluster-ceph-rbd-kvm
  volumeMode: Block
---
apiVersion: v1
kind: Pod
metadata:
  name: rbd-block-test-pod
  namespace: worker10-rbd
  labels:
    app: rbd-block-test
    storage-type: rbd-block
    node: hosted-worker10
spec:
  nodeSelector:
    kubernetes.io/hostname: hosted-worker10.hypershift.lab
  containers:
  - name: test-app
    image: registry.access.redhat.com/ubi9/ubi-minimal:latest
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      runAsNonRoot: true
      runAsUser: 1000
      seccompProfile:
        type: RuntimeDefault
    command: ["/bin/sh"]
    args:
      - -c
      - |
        echo "=== RBD Block Device Test ==="
        echo "Node: hosted-worker10.hypershift.lab"
        echo "StorageClass: ocs-storagecluster-ceph-rbd-kvm"
        echo "Block device: /dev/block0"
        echo "VolumeMode: Block (raw block device)"
        echo ""
        echo "Waiting for block device to be available..."
        sleep 5
        echo ""
        echo "Checking block device..."
        ls -lh /dev/block0 || echo "Device not found yet"
        echo ""
        echo "Block device info:"
        blockdev --getsize64 /dev/block0 2>&1 || echo "Cannot read device size"
        echo ""
        echo "Block device details:"
        lsblk /dev/block0 2>&1 || echo "lsblk not available"
        echo ""
        echo "Writing test pattern to block device (10MB)..."
        dd if=/dev/zero of=/dev/block0 bs=1M count=10 2>&1
        echo ""
        echo "Reading back from block device..."
        dd if=/dev/block0 of=/dev/null bs=1M count=10 2>&1
        echo ""
        echo "Block device test successful!"
        echo "Sleeping to keep pod running for inspection..."
        sleep infinity
    volumeDevices:
    - name: block-storage
      devicePath: /dev/block0
    resources:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "256Mi"
        cpu: "200m"
  volumes:
  - name: block-storage
    persistentVolumeClaim:
      claimName: rbd-block-test-pvc

