---
# Example CephFS PVC Manifest
# Use this as a reference or starting point
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: example-cephfs-pvc
  namespace: default
  labels:
    app: example-app
    storage-type: cephfs
spec:
  accessModes:
    - ReadWriteMany  # CephFS supports RWX
  resources:
    requests:
      storage: 5Gi
  storageClassName: ocs-storagecluster-cephfs

