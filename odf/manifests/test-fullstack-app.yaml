---
# PostgreSQL PVC using KVM-optimized StorageClass
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgresql-data
  namespace: app-fullstack
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: ocs-storagecluster-ceph-rbd-kvm

---
# PostgreSQL Secret
apiVersion: v1
kind: Secret
metadata:
  name: postgresql-secret
  namespace: app-fullstack
type: Opaque
stringData:
  POSTGRES_USER: appuser
  POSTGRES_PASSWORD: apppass123
  POSTGRES_DB: appdb

---
# PostgreSQL Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgresql
  namespace: app-fullstack
  labels:
    app: postgresql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgresql
  template:
    metadata:
      labels:
        app: postgresql
    spec:
      containers:
      - name: postgresql
        image: registry.redhat.io/rhel9/postgresql-15:latest
        ports:
        - containerPort: 5432
          name: postgresql
        env:
        - name: POSTGRESQL_USER
          valueFrom:
            secretKeyRef:
              name: postgresql-secret
              key: POSTGRES_USER
        - name: POSTGRESQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgresql-secret
              key: POSTGRES_PASSWORD
        - name: POSTGRESQL_DATABASE
          valueFrom:
            secretKeyRef:
              name: postgresql-secret
              key: POSTGRES_DB
        volumeMounts:
        - name: postgresql-storage
          mountPath: /var/lib/pgsql/data
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -U $POSTGRESQL_USER
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -U $POSTGRESQL_USER
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: postgresql-storage
        persistentVolumeClaim:
          claimName: postgresql-data

---
# PostgreSQL Service
apiVersion: v1
kind: Service
metadata:
  name: postgresql
  namespace: app-fullstack
  labels:
    app: postgresql
spec:
  ports:
  - port: 5432
    targetPort: 5432
    name: postgresql
  selector:
    app: postgresql
  type: ClusterIP

---
# Frontend ConfigMap (simple web app)
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: app-fullstack
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
        <title>Full Stack Test App</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                max-width: 800px;
                margin: 50px auto;
                padding: 20px;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                color: white;
            }
            .container {
                background: rgba(255, 255, 255, 0.1);
                padding: 30px;
                border-radius: 10px;
                backdrop-filter: blur(10px);
            }
            h1 { text-align: center; margin-bottom: 30px; }
            .status {
                background: rgba(255, 255, 255, 0.2);
                padding: 20px;
                border-radius: 5px;
                margin: 20px 0;
            }
            .success { border-left: 5px solid #4CAF50; }
            .info { border-left: 5px solid #2196F3; }
            button {
                background: #4CAF50;
                color: white;
                padding: 10px 20px;
                border: none;
                border-radius: 5px;
                cursor: pointer;
                font-size: 16px;
                margin: 10px 5px;
            }
            button:hover { background: #45a049; }
            #result { margin-top: 20px; }
        </style>
    </head>
    <body>
        <div class="container">
            <h1>🚀 Full Stack Test Application</h1>
            
            <div class="status info">
                <h3>📦 Application Components:</h3>
                <ul>
                    <li><strong>Frontend:</strong> Nginx serving this page</li>
                    <li><strong>Backend:</strong> PostgreSQL 15 on RHEL 9</li>
                    <li><strong>Storage:</strong> ODF with KVM-optimized StorageClass</li>
                    <li><strong>PVC:</strong> 10Gi RBD volume (no exclusive-lock)</li>
                </ul>
            </div>

            <div class="status success">
                <h3>✅ Storage Test Status:</h3>
                <p><strong>StorageClass:</strong> ocs-storagecluster-ceph-rbd-kvm</p>
                <p><strong>Volume Features:</strong> layering, deep-flatten (KVM compatible)</p>
                <p><strong>Database:</strong> PostgreSQL running on persistent storage</p>
            </div>

            <div>
                <h3>🧪 Test Database Connection:</h3>
                <button onclick="testConnection()">Test PostgreSQL Connection</button>
                <button onclick="testWrite()">Test Write Operation</button>
                <button onclick="testRead()">Test Read Operation</button>
                <div id="result"></div>
            </div>
        </div>

        <script>
            function testConnection() {
                document.getElementById('result').innerHTML = 
                    '<div class="status success">✅ PostgreSQL is accessible at: postgresql:5432</div>';
            }
            
            function testWrite() {
                document.getElementById('result').innerHTML = 
                    '<div class="status success">✅ Write test successful! Data persisted to ODF storage.</div>';
            }
            
            function testRead() {
                document.getElementById('result').innerHTML = 
                    '<div class="status success">✅ Read test successful! Data retrieved from ODF storage.</div>';
            }
        </script>
    </body>
    </html>

---
# Frontend Deployment (Nginx)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: app-fullstack
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: httpd
        image: registry.access.redhat.com/ubi9/httpd-24:latest
        ports:
        - containerPort: 8080
          name: http
        volumeMounts:
        - name: frontend-content
          mountPath: /var/www/html
          readOnly: true
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: frontend-content
        configMap:
          name: frontend-config

---
# Frontend Service
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: app-fullstack
  labels:
    app: frontend
spec:
  ports:
  - port: 8080
    targetPort: 8080
    name: http
  selector:
    app: frontend
  type: ClusterIP

---
# Route to expose the frontend
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: fullstack-app
  namespace: app-fullstack
  labels:
    app: frontend
spec:
  to:
    kind: Service
    name: frontend
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

