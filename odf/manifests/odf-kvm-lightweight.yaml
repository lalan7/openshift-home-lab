# ODF Lightweight Configuration for KVM/Testing
# 
# This configuration is optimized for KVM virtual machines and test/lab environments
# Trades some performance and redundancy for reliability and resource efficiency
#
# Date: October 31, 2025

---
apiVersion: ocs.openshift.io/v1
kind: StorageCluster
metadata:
  name: ocs-storagecluster
  namespace: openshift-storage
  annotations:
    odf.openshift.io/reconcile-strategy: "ignore"
spec:
  multiCloudGateway:
    enable: false
  # Minimal resource requirements for testing
  resources:
    mon:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        cpu: "1"
        memory: "2Gi"
    mgr:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        cpu: "1"
        memory: "2Gi"
    osd:
      requests:
        cpu: "1"
        memory: "2Gi"
      limits:
        cpu: "2"
        memory: "4Gi"
    mds:
      requests:
        cpu: "500m"
        memory: "2Gi"
      limits:
        cpu: "1"
        memory: "4Gi"
    rgw:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        cpu: "1"
        memory: "2Gi"

  # KVM-optimized Ceph configuration
  managedResources:
    cephCluster:
      reconcileStrategy: "ignore"  # Allow manual tuning
    
  # Custom Ceph configuration for KVM
  cephConfig:
    global:
      # Increase timeouts for KVM latency
      osd_heartbeat_grace: 60  # Default: 20 (3x for KVM)
      osd_heartbeat_interval: 10  # Default: 6
      mon_osd_down_out_interval: 600  # Default: 600 (keep same)
      
      # Reduce performance expectations
      osd_op_complaint_time: 60  # Default: 30 (allow slower ops)
      osd_recovery_max_active: 1  # Default: 3 (reduce I/O pressure)
      osd_max_backfills: 1  # Default: 1 (keep low)
      
      # Optimize for virtualized I/O
      bluestore_prefer_deferred_size_hdd: 0  # Reduce write amplification
      bluestore_compression_mode: none  # Reduce CPU overhead
      
      # Network tolerance
      ms_bind_retry_delay: 10  # Default: 5 (more patient)
      ms_bind_retry_count: 5  # Default: 3 (more retries)
      
    osd:
      # Reduce memory footprint
      osd_memory_target: 2147483648  # 2GB instead of 4GB
      
      # More tolerant of slow I/O
      osd_op_thread_timeout: 60  # Default: 15
      osd_recovery_op_priority: 1  # Default: 3 (lower priority)
      
      # Reduce journal size
      osd_journal_size: 2048  # 2GB instead of 5GB
      
    mon:
      # More tolerant monitoring
      mon_osd_report_timeout: 900  # Default: 900 (keep same)
      mon_allow_pool_delete: false  # Safety
      
    mgr:
      # Reduce mgr overhead
      mgr_tick_period: 10  # Default: 5 (less frequent)

  # Replica configuration - MINIMUM for testing
  storageDeviceSets:
    - name: ocs-deviceset
      count: 3  # Minimum for redundancy
      replica: 1  # Single replica for testing (NOT production)
      resources:
        requests:
          cpu: "1"
          memory: "2Gi"
        limits:
          cpu: "2"
          memory: "4Gi"
      dataPVCTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 100Gi  # Smaller for testing
          storageClassName: localblock  # Or your storage class
          volumeMode: Block

  # Monitoring - lightweight
  monitoring:
    reconcileStrategy: "ignore"  # Disable heavy monitoring

  # Network settings - important for KVM!
  network:
    provider: ""  # Use default OVN-Kubernetes
    selectors: {}
    
---
# Storage Class with KVM-optimized parameters
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ocs-storagecluster-ceph-rbd-kvm-optimized
provisioner: openshift-storage.rbd.csi.ceph.com
parameters:
  clusterID: openshift-storage
  pool: ocs-storagecluster-cephblockpool
  
  # Critical: Disable features incompatible with KVM
  imageFeatures: layering,deep-flatten
  
  # RBD CSI tuning for KVM
  csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
  csi.storage.k8s.io/provisioner-secret-namespace: openshift-storage
  csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
  csi.storage.k8s.io/controller-expand-secret-namespace: openshift-storage
  csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
  csi.storage.k8s.io/node-stage-secret-namespace: openshift-storage
  
  # Filesystem type optimized for virtualization
  csi.storage.k8s.io/fstype: ext4
  
  # Mount options for better KVM performance
  mounter: rbd  # Use kernel RBD (krbd)
  mapOptions: "noudev"  # Reduce overhead
  
reclaimPolicy: Delete
allowVolumeExpansion: true
volumeBindingMode: Immediate

---
# CephBlockPool with relaxed settings
apiVersion: ceph.rook.io/v1
kind: CephBlockPool
metadata:
  name: ocs-storagecluster-cephblockpool
  namespace: openshift-storage
spec:
  # Single replica for testing
  replicated:
    size: 2  # Minimum safe replica count
    requireSafeReplicaSize: false  # Allow operation if degraded
    
  # Erasure coding disabled (too complex for KVM)
  erasureCoded:
    dataChunks: 0
    codingChunks: 0
    
  # Failure domain - for testing
  failureDomain: host  # Not osd (less strict)
  
  # Compression disabled to reduce CPU
  compressionMode: none
  
  # Quotas for resource control
  quotaMaxBytes: 0  # No quota
  quotaMaxObjects: 0  # No quota

---
# CephFilesystem - lightweight for testing
apiVersion: ceph.rook.io/v1
kind: CephFilesystem
metadata:
  name: ocs-storagecluster-cephfilesystem
  namespace: openshift-storage
spec:
  metadataPool:
    replicated:
      size: 2
      requireSafeReplicaSize: false
    compressionMode: none
    
  dataPools:
    - name: data0
      replicated:
        size: 2
        requireSafeReplicaSize: false
      compressionMode: none
      
  preserveFilesystemOnDelete: false
  
  metadataServer:
    activeCount: 1  # Single MDS for testing
    activeStandby: false  # No standby
    resources:
      requests:
        cpu: "500m"
        memory: "2Gi"
      limits:
        cpu: "1"
        memory: "4Gi"
    priorityClassName: ""

---
# ConfigMap for additional Ceph tuning
apiVersion: v1
kind: ConfigMap
metadata:
  name: rook-config-override
  namespace: openshift-storage
data:
  config: |
    [global]
    # KVM-specific tuning
    osd_heartbeat_grace = 60
    osd_heartbeat_interval = 10
    osd_op_complaint_time = 60
    mon_osd_down_out_interval = 600
    
    # Reduce I/O pressure
    osd_recovery_max_active = 1
    osd_max_backfills = 1
    osd_recovery_op_priority = 1
    
    # Memory optimization
    osd_memory_target = 2147483648
    
    # Network tolerance
    ms_bind_retry_delay = 10
    ms_bind_retry_count = 5
    
    [osd]
    # Slow I/O tolerance
    osd_op_thread_timeout = 60
    osd_journal_size = 2048
    
    [mon]
    # Monitoring intervals
    mon_osd_report_timeout = 900

