---
# Test Object Bucket Claim (OBC) for RGW StorageClass
# This creates an S3-compatible bucket

apiVersion: objectbucket.io/v1alpha1
kind: ObjectBucketClaim
metadata:
  name: test-rgw-bucket
  namespace: app-fullstack
spec:
  generateBucketName: test-rgw-bucket
  storageClassName: ocs-storagecluster-ceph-rgw

---
# Pod to test S3 access using the created bucket
apiVersion: v1
kind: Pod
metadata:
  name: test-rgw
  namespace: app-fullstack
  labels:
    app: storage-test
    storage-type: rgw-s3
spec:
  containers:
  - name: s3-test
    image: registry.access.redhat.com/ubi9/ubi:latest
    command: ["/bin/bash"]
    args:
      - -c
      - |
        echo "=== RGW S3 Object Storage Test ==="
        echo "StorageClass: ocs-storagecluster-ceph-rgw"
        echo ""
        
        # Install AWS CLI
        echo "Installing AWS CLI..."
        dnf install -y python3-pip > /dev/null 2>&1
        pip3 install --quiet awscli
        
        # Get S3 credentials from the ConfigMap and Secret
        export AWS_ACCESS_KEY_ID=$(cat /s3-credentials/AWS_ACCESS_KEY_ID)
        export AWS_SECRET_ACCESS_KEY=$(cat /s3-credentials/AWS_SECRET_ACCESS_KEY)
        export S3_BUCKET=$(cat /s3-config/BUCKET_NAME)
        export S3_ENDPOINT=$(cat /s3-config/BUCKET_HOST)
        export S3_PORT=$(cat /s3-config/BUCKET_PORT)
        
        echo "Bucket Name: $S3_BUCKET"
        echo "S3 Endpoint: $S3_ENDPOINT:$S3_PORT"
        echo ""
        
        # Configure AWS CLI
        aws configure set aws_access_key_id $AWS_ACCESS_KEY_ID
        aws configure set aws_secret_access_key $AWS_SECRET_ACCESS_KEY
        aws configure set default.region us-east-1
        
        # Test S3 operations
        echo "Testing S3 operations..."
        echo ""
        
        # Create a test file
        echo "Test data from RGW - $(date)" > /tmp/test-file.txt
        
        # Upload to S3
        echo "1. Uploading test file to S3..."
        aws s3 cp /tmp/test-file.txt s3://$S3_BUCKET/test-file.txt \
          --endpoint-url http://$S3_ENDPOINT:$S3_PORT
        
        # List bucket contents
        echo ""
        echo "2. Listing bucket contents..."
        aws s3 ls s3://$S3_BUCKET/ \
          --endpoint-url http://$S3_ENDPOINT:$S3_PORT
        
        # Download from S3
        echo ""
        echo "3. Downloading file from S3..."
        aws s3 cp s3://$S3_BUCKET/test-file.txt /tmp/downloaded-file.txt \
          --endpoint-url http://$S3_ENDPOINT:$S3_PORT
        
        echo ""
        echo "4. Verifying downloaded content:"
        cat /tmp/downloaded-file.txt
        
        echo ""
        echo "=== RGW S3 Storage Test Successful! ==="
        echo ""
        echo "Keeping pod alive for manual testing..."
        echo "You can exec into this pod and use AWS CLI with pre-configured credentials"
        
        sleep infinity
    volumeMounts:
    - name: s3-credentials
      mountPath: /s3-credentials
      readOnly: true
    - name: s3-config
      mountPath: /s3-config
      readOnly: true
    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "512Mi"
        cpu: "200m"
  volumes:
  - name: s3-credentials
    secret:
      secretName: test-rgw-bucket
  - name: s3-config
    configMap:
      name: test-rgw-bucket


