---
# NetworkAttachmentDefinition using bridge CNI
# This works because br-storage exists on both baremetal hosts
# and is accessible from all VMs regardless of their interface names
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: ocs-public
  namespace: openshift-storage
  labels:
    purpose: storage-network
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "type": "bridge",
      "bridge": "br-storage",
      "isGateway": false,
      "ipMasq": false,
      "ipam": {
        "type": "whereabouts",
        "range": "10.0.0.50-10.0.0.80/24",
        "routes": [
          {"dst": "10.0.0.0/24"}
        ]
      }
    }

