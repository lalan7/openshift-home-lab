# NMState policies to rename storage interfaces to 'storage0'
# This creates a consistent interface name across all nodes
---
# Server 1 - management-worker-0: ens11 -> storage0
apiVersion: nmstate.io/v1
kind: NodeNetworkConfigurationPolicy
metadata:
  name: rename-storage-network-worker0
  labels:
    purpose: storage-network-rename
spec:
  nodeSelector:
    kubernetes.io/hostname: management-worker-0.hypershift.lab
  desiredState:
    interfaces:
    - name: storage0
      type: ethernet
      state: up
      identifier: name
      ipv4:
        enabled: true
        address:
        - ip: 10.0.0.30
          prefix-length: 24
        dhcp: false
      ipv6:
        enabled: false
    - name: ens11
      type: ethernet
      state: absent

