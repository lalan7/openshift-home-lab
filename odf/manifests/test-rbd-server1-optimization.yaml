---
apiVersion: v1
kind: Namespace
metadata:
  name: test-rbd-optimization
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: test-rbd-server1
  namespace: test-rbd-optimization
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: ocs-storagecluster-ceph-rbd-kvm
---
apiVersion: v1
kind: Pod
metadata:
  name: test-rbd-server1
  namespace: test-rbd-optimization
spec:
  nodeSelector:
    kubernetes.io/hostname: management-worker-1.hypershift.lab
  containers:
  - name: test
    image: registry.access.redhat.com/ubi9/ubi-minimal:latest
    command:
      - /bin/sh
      - -c
      - |
        echo "=== RBD Mount Test on Server 1 After Buffer Optimization ==="
        echo "Hostname: $(hostname)"
        echo "Node: management-worker-1"
        echo "Mount point: /data"
        echo ""
        df -h /data
        echo ""
        echo "Writing 100MB test file..."
        time dd if=/dev/zero of=/data/testfile bs=1M count=100
        echo ""
        echo "=== Test PASSED! ==="
        ls -lh /data/testfile
        echo ""
        echo "Keeping pod running for inspection..."
        sleep infinity
    volumeMounts:
    - name: data
      mountPath: /data
  volumes:
  - name: data
    persistentVolumeClaim:
      claimName: test-rbd-server1

