---
# NetworkAttachmentDefinition for Ceph Storage Network
# This NAD uses enp11s0 which exists on Server 2 nodes (hosted-worker7,8,9)
# All Ceph storage pods (MON, OSD, MGR, MDS) run on these nodes
# We will also constrain CSI pods to run only on these nodes
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: ocs-public
  namespace: openshift-storage
  labels:
    purpose: storage-network
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "type": "macvlan",
      "master": "enp11s0",
      "mode": "bridge",
      "ipam": {
        "type": "whereabouts",
        "range": "10.0.0.50-10.0.0.80/24",
        "routes": [
          {"dst": "10.0.0.0/24"}
        ]
      }
    }

