---
# Test Application for All ODF StorageClasses
# Project: app-fullstack
# This manifest creates simple test pods for each StorageClass

# 1. RBD (Block Storage) - Standard
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: test-rbd-standard
  namespace: app-fullstack
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: ocs-storagecluster-ceph-rbd

---
apiVersion: v1
kind: Pod
metadata:
  name: test-rbd-standard
  namespace: app-fullstack
  labels:
    app: storage-test
    storage-type: rbd-standard
spec:
  containers:
  - name: app
    image: registry.access.redhat.com/ubi9/ubi-minimal:latest
    command: ["/bin/sh"]
    args:
      - -c
      - |
        echo "=== RBD Standard Storage Test ==="
        echo "StorageClass: ocs-storagecluster-ceph-rbd"
        echo "Mount point: /data"
        df -h /data
        echo "Writing test file..."
        date > /data/test-rbd-standard.txt
        echo "Test file content:"
        cat /data/test-rbd-standard.txt
        echo "Storage test successful!"
        sleep infinity
    volumeMounts:
    - name: data
      mountPath: /data
    resources:
      requests:
        memory: "64Mi"
        cpu: "50m"
      limits:
        memory: "128Mi"
        cpu: "100m"
  volumes:
  - name: data
    persistentVolumeClaim:
      claimName: test-rbd-standard

# 2. RBD (Block Storage) - KVM Optimized
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: test-rbd-kvm
  namespace: app-fullstack
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: ocs-storagecluster-ceph-rbd-kvm

---
apiVersion: v1
kind: Pod
metadata:
  name: test-rbd-kvm
  namespace: app-fullstack
  labels:
    app: storage-test
    storage-type: rbd-kvm
spec:
  containers:
  - name: app
    image: registry.access.redhat.com/ubi9/ubi-minimal:latest
    command: ["/bin/sh"]
    args:
      - -c
      - |
        echo "=== RBD KVM-Optimized Storage Test ==="
        echo "StorageClass: ocs-storagecluster-ceph-rbd-kvm"
        echo "Features: layering, deep-flatten (no exclusive-lock)"
        echo "Mount point: /data"
        df -h /data
        echo "Writing test file..."
        date > /data/test-rbd-kvm.txt
        echo "Test file content:"
        cat /data/test-rbd-kvm.txt
        echo "Storage test successful!"
        sleep infinity
    volumeMounts:
    - name: data
      mountPath: /data
    resources:
      requests:
        memory: "64Mi"
        cpu: "50m"
      limits:
        memory: "128Mi"
        cpu: "100m"
  volumes:
  - name: data
    persistentVolumeClaim:
      claimName: test-rbd-kvm

# 3. CephFS (Shared Filesystem Storage)
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: test-cephfs
  namespace: app-fullstack
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
  storageClassName: ocs-storagecluster-cephfs

---
apiVersion: v1
kind: Pod
metadata:
  name: test-cephfs-1
  namespace: app-fullstack
  labels:
    app: storage-test
    storage-type: cephfs
spec:
  containers:
  - name: app
    image: registry.access.redhat.com/ubi9/ubi-minimal:latest
    command: ["/bin/sh"]
    args:
      - -c
      - |
        echo "=== CephFS Shared Storage Test (Pod 1) ==="
        echo "StorageClass: ocs-storagecluster-cephfs"
        echo "Access Mode: ReadWriteMany"
        echo "Mount point: /shared"
        df -h /shared
        echo "Writing test file from pod 1..."
        date > /shared/test-cephfs-pod1.txt
        echo "Listing shared files:"
        ls -lh /shared/
        echo "Storage test successful!"
        sleep infinity
    volumeMounts:
    - name: shared
      mountPath: /shared
    resources:
      requests:
        memory: "64Mi"
        cpu: "50m"
      limits:
        memory: "128Mi"
        cpu: "100m"
  volumes:
  - name: shared
    persistentVolumeClaim:
      claimName: test-cephfs

---
apiVersion: v1
kind: Pod
metadata:
  name: test-cephfs-2
  namespace: app-fullstack
  labels:
    app: storage-test
    storage-type: cephfs
spec:
  containers:
  - name: app
    image: registry.access.redhat.com/ubi9/ubi-minimal:latest
    command: ["/bin/sh"]
    args:
      - -c
      - |
        echo "=== CephFS Shared Storage Test (Pod 2) ==="
        echo "StorageClass: ocs-storagecluster-cephfs"
        echo "Access Mode: ReadWriteMany (same PVC as Pod 1)"
        echo "Mount point: /shared"
        df -h /shared
        sleep 10
        echo "Writing test file from pod 2..."
        date > /shared/test-cephfs-pod2.txt
        echo "Listing shared files (should see both pod1 and pod2 files):"
        ls -lh /shared/
        echo "Storage test successful!"
        sleep infinity
    volumeMounts:
    - name: shared
      mountPath: /shared
    resources:
      requests:
        memory: "64Mi"
        cpu: "50m"
      limits:
        memory: "128Mi"
        cpu: "100m"
  volumes:
  - name: shared
    persistentVolumeClaim:
      claimName: test-cephfs

# Summary Dashboard Pod
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: storage-dashboard
  namespace: app-fullstack
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
        <title>ODF Storage Test Dashboard</title>
        <style>
            body {
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                margin: 0;
                padding: 20px;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            }
            .container {
                max-width: 1200px;
                margin: 0 auto;
                background: white;
                border-radius: 10px;
                padding: 30px;
                box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            }
            h1 {
                color: #667eea;
                text-align: center;
                margin-bottom: 10px;
            }
            .subtitle {
                text-align: center;
                color: #666;
                margin-bottom: 30px;
            }
            .storage-grid {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
                gap: 20px;
                margin-top: 30px;
            }
            .storage-card {
                border: 2px solid #e0e0e0;
                border-radius: 8px;
                padding: 20px;
                transition: transform 0.2s, box-shadow 0.2s;
            }
            .storage-card:hover {
                transform: translateY(-5px);
                box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            }
            .storage-card.rbd { border-left: 5px solid #4CAF50; }
            .storage-card.cephfs { border-left: 5px solid #2196F3; }
            .storage-card h3 {
                margin-top: 0;
                color: #333;
            }
            .feature-list {
                list-style: none;
                padding: 0;
            }
            .feature-list li {
                padding: 5px 0;
                color: #666;
            }
            .feature-list li:before {
                content: "✓ ";
                color: #4CAF50;
                font-weight: bold;
            }
            .status {
                display: inline-block;
                padding: 5px 10px;
                border-radius: 5px;
                font-size: 12px;
                font-weight: bold;
                margin-top: 10px;
            }
            .status.active {
                background: #4CAF50;
                color: white;
            }
            .cluster-info {
                background: #f5f5f5;
                padding: 20px;
                border-radius: 8px;
                margin-bottom: 30px;
            }
            .cluster-info h2 {
                margin-top: 0;
                color: #667eea;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <h1>🚀 ODF Storage Test Dashboard</h1>
            <p class="subtitle">Testing All Available StorageClasses</p>
            
            <div class="cluster-info">
                <h2>Cluster Information</h2>
                <p><strong>Project:</strong> app-fullstack</p>
                <p><strong>ODF Version:</strong> 4.18.12</p>
                <p><strong>Storage Backend:</strong> Ceph (3 MONs, 2 MGRs, 3 OSDs)</p>
                <p><strong>Total Capacity:</strong> ~900GB (3x 300GB disks)</p>
            </div>

            <div class="storage-grid">
                <div class="storage-card rbd">
                    <h3>📦 RBD Standard</h3>
                    <p><strong>StorageClass:</strong> ocs-storagecluster-ceph-rbd</p>
                    <ul class="feature-list">
                        <li>Block storage (ext4)</li>
                        <li>ReadWriteOnce</li>
                        <li>Full RBD features</li>
                        <li>Best for: Databases, VMs</li>
                    </ul>
                    <span class="status active">ACTIVE</span>
                </div>

                <div class="storage-card rbd">
                    <h3>🖥️ RBD KVM-Optimized</h3>
                    <p><strong>StorageClass:</strong> ocs-storagecluster-ceph-rbd-kvm</p>
                    <ul class="feature-list">
                        <li>Block storage (ext4)</li>
                        <li>ReadWriteOnce</li>
                        <li>No exclusive-lock</li>
                        <li>Features: layering, deep-flatten</li>
                        <li>Best for: KVM VMs, nested virt</li>
                    </ul>
                    <span class="status active">ACTIVE</span>
                </div>

                <div class="storage-card cephfs">
                    <h3>📁 CephFS Shared</h3>
                    <p><strong>StorageClass:</strong> ocs-storagecluster-cephfs</p>
                    <ul class="feature-list">
                        <li>Shared filesystem</li>
                        <li>ReadWriteMany</li>
                        <li>Multiple pods can access</li>
                        <li>Best for: Shared data, logs</li>
                    </ul>
                    <span class="status active">ACTIVE</span>
                </div>
            </div>

            <div style="margin-top: 40px; padding: 20px; background: #e3f2fd; border-radius: 8px;">
                <h3>📊 Test Results</h3>
                <p>All StorageClasses are being tested with simple pods that:</p>
                <ul>
                    <li>Create a PVC using each StorageClass</li>
                    <li>Mount the volume</li>
                    <li>Write test data</li>
                    <li>Verify read/write operations</li>
                </ul>
                <p><strong>Check pod logs to see test results:</strong></p>
                <code style="background: white; padding: 10px; display: block; margin-top: 10px; border-radius: 5px;">
                    oc logs -n app-fullstack test-rbd-standard<br>
                    oc logs -n app-fullstack test-rbd-kvm<br>
                    oc logs -n app-fullstack test-cephfs-1<br>
                    oc logs -n app-fullstack test-cephfs-2
                </code>
            </div>
        </div>
    </body>
    </html>

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storage-dashboard
  namespace: app-fullstack
  labels:
    app: storage-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: storage-dashboard
  template:
    metadata:
      labels:
        app: storage-dashboard
    spec:
      containers:
      - name: httpd
        image: registry.access.redhat.com/ubi9/httpd-24:latest
        ports:
        - containerPort: 8080
          name: http
        volumeMounts:
        - name: dashboard-content
          mountPath: /var/www/html
          readOnly: true
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
      volumes:
      - name: dashboard-content
        configMap:
          name: storage-dashboard

---
apiVersion: v1
kind: Service
metadata:
  name: storage-dashboard
  namespace: app-fullstack
spec:
  ports:
  - port: 8080
    targetPort: 8080
    name: http
  selector:
    app: storage-dashboard
  type: ClusterIP

---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: storage-dashboard
  namespace: app-fullstack
spec:
  to:
    kind: Service
    name: storage-dashboard
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect


