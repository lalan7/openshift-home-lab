---
# ObjectBucketClaim for OADP HCP Backups
# 
# This creates an S3 bucket in ODF RGW for OADP to store backups.
# The bucket credentials are auto-generated and stored in:
#   - Secret: oadp-hcp-bucket (AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY)
#   - ConfigMap: oadp-hcp-bucket (BUCKET_NAME, BUCKET_HOST, BUCKET_PORT)
#
# Usage:
#   oc apply -f oadp-rgw-bucket.yaml
#
apiVersion: objectbucket.io/v1alpha1
kind: ObjectBucketClaim
metadata:
  name: oadp-hcp-bucket
  namespace: openshift-adp
  labels:
    app.kubernetes.io/component: oadp-backup
    app.kubernetes.io/part-of: hcp-dr
spec:
  generateBucketName: oadp-hcp-backup
  storageClassName: ocs-storagecluster-ceph-rgw
